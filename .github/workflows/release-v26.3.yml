name: Build and release Carpet Extra 26.3

on:
  workflow_dispatch:

concurrency:
  group: carpet-extra-release-v26.3
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build and run game tests
        run: |
          chmod +x gradlew
          ./gradlew build runGametest --no-daemon
      - name: Check release artifact
        run: test -f build/libs/carpet-extra-26.3.jar
      - name: Save release artifact
        uses: actions/upload-artifact@v7
        with:
          name: carpet-extra-26.3
          path: build/libs/carpet-extra-26.3.jar
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v26.3 build/libs/carpet-extra-26.3.jar \
            --target "$GITHUB_SHA" \
            --title "Carpet Extra 26.3 for Minecraft 26.3" \
            --notes "Updated for Minecraft 26.3. Requires Fabric Loader 0.19.5, Fabric Carpet 26.3, and Java 25. The 26.3 port updates dispenser tool transformations and other changed game APIs."
